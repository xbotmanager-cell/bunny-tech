<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny Engine - Matrix Calculator</title>

    <!-- Lucide Icons Framework -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-color: #0d0614;
            --purple-glow: rgba(191, 90, 242, 0.15);
            --pink-glow: rgba(255, 55, 127, 0.15);
            --yellow-glow: #ffd60a;
            --glass-bg: rgba(25, 15, 38, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f2f2f7;
            --text-muted: #aeaeae;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Backdrop */
        body::before {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--purple-glow);
            filter: blur(120px);
            top: -5%;
            right: -10%;
            z-index: -1;
        }

        /* Module Header Section */
        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 16px 20px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            transition: all 0.2s ease;
        }

        .back-link:active {
            transform: scale(0.92);
            border-color: rgba(191, 90, 242, 0.4);
        }

        .module-title-block {
            text-align: right;
        }

        .module-title-block h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .module-title-block p {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Calculator Main Shell */
        .calc-wrapper {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 24px;
            backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        /* Display Interface Screen */
        .calc-screen {
            background: rgba(13, 6, 20, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            min-height: 90px;
            overflow: hidden;
        }

        #calcc-history {
            font-size: 0.85rem;
            color: var(--text-muted);
            min-height: 18px;
            letter-spacing: 0.5px;
            word-wrap: break-word;
            word-break: break-all;
            max-width: 100%;
        }

        #calc-output {
            font-size: 2rem;
            font-weight: 600;
            margin-top: 4px;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        /* Keyboard Grid Layout */
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            height: 64px;
            border-radius: 18px;
            font-size: 1.35rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .calc-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Functional Specialty Key Highlights */
        .calc-btn.clear-key {
            color: var(--pink-glow);
            background: rgba(255, 55, 127, 0.05);
            border-color: rgba(255, 55, 127, 0.15);
        }

        .calc-btn.op-key {
            color: var(--purple-glow);
            font-weight: 600;
            background: rgba(191, 90, 242, 0.05);
            border-color: rgba(191, 90, 242, 0.15);
        }

        .calc-btn.equal-key {
            background: rgba(191, 90, 242, 0.25);
            border-color: rgba(191, 90, 242, 0.4);
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(191, 90, 242, 0.25);
        }

        /* Modern Customc Toast Container */
        .toast-box {
            position: fixed;
            top: 25px;
            left: 20px;
            right: 20px;
            background: rgba(25, 15, 38, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-left: 4px solid #30d158;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(-100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 500;
        }

        .toast-box.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Header Operations Section -->
    <div class="module-header">
        <a href="../index.html" class="back-link">
            <i data-lucide="arrow-left"></i>
        </a>
        <div class="module-title-block">
            <h1>Matrix Utility</h1>
            <p>Category // Tools</p>
        </div>
    </div>

    <!-- Active Core Calculator Utility Component -->
    <div class="calc-wrapper">
        <div class="calc-screen">
            <div id="calc-history"></div>
            <div id="calc-output">0</div>
        </div>

        <div class="calc-grid">
            <!-- Row 1 Commands -->
            <div class="calc-btn clear-key" onclick="clearAll()">C</div>
            <div class="calc-btn op-key" onclick="appendOperator('%')">%</div>
            <div class="calc-btn op-key" onclick="backspace()"><i data-lucide="delete"></i></div>
            <div class="calc-btn op-key" onclick="appendOperator('/')">/</div>

            <!-- Row 2 Commands -->
            <div class="calc-btn" onclick="appendNumber('7')">7</div>
            <div class="calc-btn" onclick="appendNumber('8')">8</div>
            <div class="calc-btn" onclick="appendNumber('9')">9</div>
            <div class="calc-btn op-key" onclick="appendOperator('*')">&times;</div>

            <!-- Row 3 Commands -->
            <div class="calc-btn" onclick="appendNumber('4')">4</div>
            <div class="calc-btn" onclick="appendNumber('5')">5</div>
            <div class="calc-btn" onclick="appendNumber('6')">6</div>
            <div class="calc-btn op-key" onclick="appendOperator('-')">-</div>

            <!-- Row 4 Commands -->
            <div class="calc-btn" onclick="appendNumber('1')">1</div>
            <div class="calc-btn" onclick="appendNumber('2')">2</div>
            <div class="calc-btn" onclick="appendNumber('3')">3</div>
            <div class="calc-btn op-key" onclick="appendOperator('+')">+</div>

            <!-- Row 5 Commands -->
            <div class="calc-btn" style="grid-column: span 2" onclick="appendNumber('0')">0</div>
            <div class="calc-btn" onclick="appendDecimal('.')">.</div>
            <div class="calc-btn equal-key" onclick="calculateResult()">=</div>
        </div>
    </div>

    <!-- Isolated Toast Context Shell -->
    <div class="toast-box" id="calcToast">
        <i data-lucide="check-circle" style="color:#30d158"></i>
        <span id="toastMsg">Calculation Matrix Compiled</span>
    </div>

    <script>
        // Init Lucide Vector Set
        lucide.createIcons();

        // Screen Output Handles
        const historyDisplay = document.getElementById('calc-history');
        const outputDisplay = document.getElementById('calc-output');
        const toast = document.getElementById('calcToast');
        const toastMsg = document.getElementById('toastMsg');

        let evaluationString = '';
        let expressionHistory = '';
        let shouldResetOutput = false;

        // Custom Silent Toast Notification Interface
        function triggerToastNotification(msg) {
            toastMsg.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function appendNumber(num) {
            if (outputDisplay.innerText === '0' || shouldResetOutput) {
                outputDisplay.innerText = num;
                shouldResetOutput = false;
            } else {
                if (outputDisplay.innerText.length < 12) {
                    outputDisplay.innerText += num;
                }
            }
            evaluationString += num;
        }

        function appendOperator(op) {
            if (evaluationString === '' && op !== '-') return;

            const lastChar = evaluationString.slice(-1);
            if (['+', '-', '*', '/', '%'].includes(lastChar)) {
                evaluationString = evaluationString.slice(0, -1) + op;
            } else {
                evaluationString += op;
            }

            expressionHistory = evaluationString;
            historyDisplay.innerText = expressionHistory.replace(/\*/g, '×');
            shouldResetOutput = true;
        }

        function appendDecimal(dot) {
            if (shouldResetOutput) {
                outputDisplay.innerText = '0.';
                evaluationString += '0.';
                shouldResetOutput = false;
                return;
            }
            if (!outputDisplay.innerText.includes('.')) {
                outputDisplay.innerText += dot;
                evaluationString += dot;
            }
        }

        function clearAll() {
            evaluationString = '';
            expressionHistory = '';
            outputDisplay.innerText = '0';
            historyDisplay.innerText = '';
            shouldResetOutput = false;
        }

        function backspace() {
            if (shouldResetOutput) return;

            outputDisplay.innerText = outputDisplay.innerText.slice(0, -1);
            evaluationString = evaluationString.slice(0, -1);

            if (outputDisplay.innerText === '') {
                outputDisplay.innerText = '0';
            }
        }

        function calculateResult() {
            if (evaluationString === '') return;

            try {
                // Secure, isolated parsing verification logic for safety
                const lastChar = evaluationString.slice(-1);
                if (['+', '-', '*', '/', '%'].includes(lastChar)) {
                    evaluationString = evaluationString.slice(0, -1);
                }

                let finalOutput = Function(`"use strict"; return (${evaluationString})`)();

                // Float precision processing configuration set
                if (finalOutput % 1 !== 0) {
                    finalOutput = parseFloat(finalOutput.toFixed(4));
                }

                historyDisplay.innerText = evaluationString.replace(/\*/g, '×') + ' =';
                outputDisplay.innerText = finalOutput;

                triggerToastNotification(`Result Compiled: ${finalOutput}`);

                evaluationString = finalOutput.toString();
                shouldResetOutput = true;

            } catch (error) {
                outputDisplay.innerText = 'Error';
                historyDisplay.innerText = '';
                evaluationString = '';
                shouldResetOutput = true;
            }
        }
    </script>
</body>
</html>
