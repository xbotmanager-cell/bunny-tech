<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bunny Dash Runner</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
    }
    
    body {
        background: #06020a;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        touch-action: none;
    }
    
    #gameCanvas {
        display: block;
        background: linear-gradient(180deg, #0d0618 0%, #06020a 100%);
    }
    
    .ui {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        pointer-events: none;
    }
    
    .score-box {
        background: rgba(22, 11, 36, 0.55);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 16px;
        padding: 8px 16px;
        color: #f5f5f7;
    }
    
    .score-label {
        font-size: 0.7rem;
        color: #9e9eb4;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
    }
    
    .score-value {
        font-size: 1.2rem;
        font-weight: 800;
        color: #bf5af2;
        text-shadow: 0 0 12px rgba(191, 90, 242, 0.5);
    }
    
    .btn {
        pointer-events: auto;
        background: rgba(22, 11, 36, 0.55);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.07);
        color: #f5f5f7;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1.2rem;
    }
    
    .btn:active {
        transform: scale(0.9);
    }
    
    .screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(6, 2, 10, 0.95);
        backdrop-filter: blur(20px);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
        color: #f5f5f7;
        text-align: center;
        padding: 20px;
    }
    
    .screen.active {
        display: flex;
    }
    
    .screen h1 {
        font-size: 2.5rem;
        font-weight: 900;
        background: linear-gradient(135deg, #bf5af2, #ff377f);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
    }
    
    .screen p {
        color: #9e9eb4;
        margin-bottom: 24px;
        font-size: 0.9rem;
    }
    
    .play-btn {
        background: linear-gradient(135deg, #bf5af2, #ff377f);
        border: none;
        color: white;
        padding: 14px 32px;
        border-radius: 30px;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(191, 90, 242, 0.4);
    }
    
    .play-btn:active {
        transform: scale(0.95);
    }
    
    .final-score {
        font-size: 3rem;
        font-weight: 900;
        color: #ffd60a;
        text-shadow: 0 0 20px rgba(255, 214, 10, 0.5);
        margin: 16px 0;
    }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div class="ui">
    <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-value" id="score">0</div>
    </div>
    <div class="score-box">
        <div class="score-label">Best</div>
        <div class="score-value" id="highScore">0</div>
    </div>
    <div class="btn" id="pauseBtn">II</div>
</div>

<div class="screen active" id="startScreen">
    <h1>BUNNY DASH</h1>
    <p>Tap to jump. Avoid obstacles.<br>How far can you go?</p>
    <button class="play-btn" id="startBtn">PLAY</button>
</div>

<div class="screen" id="gameOverScreen">
    <h1>GAME OVER</h1>
    <div class="final-score" id="finalScore">0</div>
    <p id="newBest" style="color: #30d158; display: none;">NEW BEST!</p>
    <button class="play-btn" id="restartBtn">PLAY AGAIN</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H, groundY;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    groundY = H - 80;
}
resize();
window.addEventListener('resize', resize);

// Game state
let gameRunning = false;
let gamePaused = false;
let score = 0;
let highScore = localStorage.getItem('bunnyHighScore') || 0;
let speed = 6;
let frame = 0;

document.getElementById('highScore').textContent = highScore;

// Bunny player
const bunny = {
    x: 80,
    y: 0,
    w: 40,
    h: 40,
    vy: 0,
    gravity: 0.8,
    jumpPower: -16,
    grounded: false,
    rotation: 0
};

// Obstacles array
let obstacles = [];
let particles = [];
let clouds = [];

// Initialize clouds
for (let i = 0; i < 5; i++) {
    clouds.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.4,
        w: 60 + Math.random() * 40,
        speed: 0.5 + Math.random() * 0.5
    });
}

function resetGame() {
    bunny.y = groundY - bunny.h;
    bunny.vy = 0;
    bunny.grounded = true;
    bunny.rotation = 0;
    obstacles = [];
    particles = [];
    score = 0;
    speed = 6;
    frame = 0;
    gameRunning = true;
    gamePaused = false;
    document.getElementById('score').textContent = '0';
}

function jump() {
    if (!gameRunning || gamePaused) return;
    if (bunny.grounded) {
        bunny.vy = bunny.jumpPower;
        bunny.grounded = false;
        createParticles(bunny.x + bunny.w/2, bunny.y + bunny.h, '#bf5af2', 8);
    }
}

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 2,
            life: 30,
            color: color,
            size: 2 + Math.random() * 3
        });
    }
}

function spawnObstacle() {
    const types = ['cactus', 'rock', 'spike'];
    const type = types[Math.floor(Math.random() * types.length)];
    let h = 40 + Math.random() * 30;
    let w = 30 + Math.random() * 20;
    
    obstacles.push({
        x: W + 50,
        y: groundY - h,
        w: w,
        h: h,
        type: type,
        passed: false
    });
}

function update() {
    if (!gameRunning || gamePaused) return;
    
    frame++;
    
    // Bunny physics
    bunny.vy += bunny.gravity;
    bunny.y += bunny.vy;
    
    if (bunny.y + bunny.h >= groundY) {
        bunny.y = groundY - bunny.h;
        bunny.vy = 0;
        bunny.grounded = true;
        bunny.rotation = 0;
    } else {
        bunny.rotation += 0.2;
    }
    
    // Spawn obstacles
    if (frame % Math.floor(90 - speed * 2) === 0) {
        spawnObstacle();
    }
    
    // Update obstacles
    obstacles.forEach((obs, i) => {
        obs.x -= speed;
        
        // Score
        if (!obs.passed && obs.x + obs.w < bunny.x) {
            obs.passed = true;
            score += 10;
            document.getElementById('score').textContent = score;
            if (score % 50 === 0) speed += 0.3;
        }
        
        // Collision
        if (bunny.x < obs.x + obs.w &&
            bunny.x + bunny.w > obs.x &&
            bunny.y < obs.y + obs.h &&
            bunny.y + bunny.h > obs.y) {
            gameOver();
        }
        
        // Remove off screen
        if (obs.x + obs.w < 0) {
            obstacles.splice(i, 1);
        }
    });
    
    // Update particles
    particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    });
    
    // Update clouds
    clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x + c.w < 0) {
            c.x = W + c.w;
            c.y = Math.random() * H * 0.4;
        }
    });
}

function draw() {
    // Clear
    ctx.fillStyle = '#06020a';
    ctx.fillRect(0, 0, W, H);
    
    // Stars
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    for (let i = 0; i < 50; i++) {
        let x = (i * 37) % W;
        let y = (i * 71) % (H * 0.6);
        ctx.fillRect(x, y, 1, 1);
    }
    
    // Clouds
    ctx.fillStyle = 'rgba(191, 90, 242, 0.1)';
    clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.w/2, 0, Math.PI * 2);
        ctx.arc(c.x + c.w/3, c.y, c.w/2.5, 0, Math.PI * 2);
        ctx.fill();
    });
    
    // Ground
    ctx.fillStyle = '#160b24';
    ctx.fillRect(0, groundY, W, H - groundY);
    
    // Ground line glow
    ctx.strokeStyle = '#bf5af2';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#bf5af2';
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    // Particles
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 30;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    
    // Obstacles
    obstacles.forEach(obs => {
        if (obs.type === 'cactus') {
            ctx.fillStyle = '#30d158';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#30d158';
        } else if (obs.type === 'rock') {
            ctx.fillStyle = '#9e9eb4';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#9e9eb4';
        } else {
            ctx.fillStyle = '#ff377f';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff377f';
        }
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.shadowBlur = 0;
    });
    
    // Bunny
    ctx.save();
    ctx.translate(bunny.x + bunny.w/2, bunny.y + bunny.h/2);
    ctx.rotate(bunny.rotation);
    
    // Body
    ctx.fillStyle = '#bf5af2';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#bf5af2';
    ctx.fillRect(-bunny.w/2, -bunny.h/2, bunny.w, bunny.h);
    
    // Ears
    ctx.fillRect(-bunny.w/2 + 5, -bunny.h/2 - 15, 8, 20);
    ctx.fillRect(bunny.w/2 - 13, -bunny.h/2 - 15, 8, 20);
    
    // Eye
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(bunny.w/2 - 12, -bunny.h/2 + 10, 6, 6);
    
    ctx.restore();
    ctx.shadowBlur = 0;
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function gameOver() {
    gameRunning = false;
    createParticles(bunny.x + bunny.w/2, bunny.y + bunny.h/2, '#ff377f', 20);
    
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('bunnyHighScore', highScore);
        document.getElementById('highScore').textContent = highScore;
        document.getElementById('newBest').style.display = 'block';
    } else {
        document.getElementById('newBest').style.display = 'none';
    }
    
    document.getElementById('finalScore').textContent = score;
    setTimeout(() => {
        document.getElementById('gameOverScreen').classList.add('active');
    }, 500);
}

// Controls
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    jump();
});

canvas.addEventListener('mousedown', jump);

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        jump();
    }
});

document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startScreen').classList.remove('active');
    resetGame();
});

document.getElementById('restartBtn').addEventListener('click', () => {
    document.getElementById('gameOverScreen').classList.remove('active');
    resetGame();
});

document.getElementById('pauseBtn').addEventListener('click', () => {
    if (!gameRunning) return;
    gamePaused = !gamePaused;
    document.getElementById('pauseBtn').textContent = gamePaused ? '▶' : 'II';
});

// Start loop
gameLoop();
</script>
</body>
</html>
