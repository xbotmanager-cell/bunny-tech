<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bunny Password Generator</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
    }

    :root {
        --purple-glow: #bf5af2;
        --pink-glow: #ff377f;
        --glass-bg: rgba(22, 11, 36, 0.75);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-main: #f5f5f7;
        --text-sub: #9e9eb4;
        --bg-dark: #06020a;
        --success: #30d158;
        --danger: #ff453a;
        --warning: #ffd60a;
    }

    body {
        background: var(--bg-dark);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text-main);
        min-height: 100vh;
        padding: 16px;
    }

   .logo-header {
        text-align: center;
        margin-bottom: 24px;
    }

   .logo {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        margin: 0 auto 12px;
        display: block;
        box-shadow: 0 8px 32px rgba(191, 90, 242, 0.4);
    }

   .logo-header h1 {
        font-size: 1.6rem;
        font-weight: 900;
        background: linear-gradient(135deg, var(--purple-glow), var(--pink-glow));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 4px;
    }

   .logo-header p {
        color: var(--text-sub);
        font-size: 0.85rem;
    }

   .card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        padding: 18px;
        margin-bottom: 16px;
    }

   .card-title {
        font-size: 0.75rem;
        color: var(--text-sub);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

   .btn {
        background: linear-gradient(135deg, var(--purple-glow), var(--pink-glow));
        border: none;
        color: white;
        padding: 16px 24px;
        border-radius: 14px;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        box-shadow: 0 6px 20px rgba(191, 90, 242, 0.4);
    }

   .btn:active {
        transform: scale(0.97);
    }

   .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        box-shadow: none;
        border: 1px solid var(--glass-border);
    }

   .btn-icon {
        width: 48px;
        height: 48px;
        padding: 0;
        border-radius: 12px;
    }

   .strength-group {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 16px;
    }

   .strength-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid var(--glass-border);
        border-radius: 12px;
        padding: 14px 8px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
    }

   .strength-btn.active {
        border-color: var(--purple-glow);
        background: rgba(191, 90, 242, 0.15);
        box-shadow: 0 0 16px rgba(191, 90, 242, 0.3);
    }

   .strength-btn h4 {
        font-size: 0.9rem;
        margin-bottom: 2px;
    }

   .strength-btn p {
        font-size: 0.65rem;
        color: var(--text-sub);
    }

   .slider-group {
        margin: 20px 0;
    }

   .slider-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-size: 0.9rem;
        font-weight: 700;
    }

   .char-input {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--glass-border);
        border-radius: 8px;
        padding: 8px 12px;
        color: var(--text-main);
        font-size: 1rem;
        font-weight: 700;
        width: 70px;
        text-align: center;
        -webkit-user-select: text;
        user-select: text;
    }

   .slider {
        -webkit-appearance: none;
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        outline: none;
    }

   .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 24px;
        height: 24px;
        background: linear-gradient(135deg, var(--purple-glow), var(--pink-glow));
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 0 12px rgba(191, 90, 242, 0.5);
    }

   .output-box {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 18px;
        font-family: 'Courier New', monospace;
        font-size: 1rem;
        word-break: break-all;
        min-height: 70px;
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        -webkit-user-select: text;
        user-select: text;
    }

   .strength-meter {
        height: 5px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 10px;
    }

   .strength-fill {
        height: 100%;
        width: 0%;
        transition: all 0.3s;
    }

   .strength-fill.weak { background: var(--danger); width: 25%; }
   .strength-fill.medium { background: var(--warning); width: 50%; }
   .strength-fill.strong { background: var(--success); width: 75%; }
   .strength-fill.very-strong { background: linear-gradient(90deg, var(--purple-glow), var(--pink-glow)); width: 100%; }

   .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

   .toggle-row:last-child {
        border-bottom: none;
    }

   .toggle {
        width: 52px;
        height: 28px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        position: relative;
        cursor: pointer;
        transition: all 0.2s;
    }

   .toggle.active {
        background: var(--purple-glow);
    }

   .toggle-knob {
        width: 24px;
        height: 24px;
        background: white;
        border-radius: 50%;
        position: absolute;
        top: 2px;
        left: 2px;
        transition: all 0.2s;
    }

   .toggle.active.toggle-knob {
        left: 26px;
    }

   .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 14px 22px;
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 200;
        transition: transform 0.3s;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

   .toast.show {
        transform: translateX(-50%) translateY(0);
    }
</style>
</head>
<body>

<div class="logo-header">
    <img src="https://i.ibb.co/LDMjMYyy/file-00000000855c71f89fb70f5f8bebc2b2.png" alt="Bunny Logo" class="logo">
    <h1>BUNNY PASSWORDS</h1>
    <p>Generate strong passwords instantly</p>
</div>

<div class="card">
    <div class="card-title">
        <i data-lucide="shield" style="width: 16px; height: 16px;"></i>
        PASSWORD STRENGTH
    </div>
    <div class="strength-group">
        <div class="strength-btn active" data-strength="easy">
            <h4>Easy</h4>
            <p>Readable</p>
        </div>
        <div class="strength-btn" data-strength="normal">
            <h4>Normal</h4>
            <p>Mixed</p>
        </div>
        <div class="strength-btn" data-strength="hard">
            <h4>Hard</h4>
            <p>Random</p>
        </div>
    </div>

    <div class="slider-group">
        <div class="slider-header">
            <span>Character Count</span>
            <input type="number" class="char-input" id="charInput" min="4" max="128" value="12">
        </div>
        <input type="range" class="slider" id="lengthSlider" min="4" max="128" value="12">
    </div>
</div>

<div class="card">
    <div class="card-title">
        <i data-lucide="settings-2" style="width: 16px; height: 16px;"></i>
        OPTIONS
    </div>
    <div class="toggle-row">
        <span>Include Numbers</span>
        <div class="toggle active" data-option="numbers">
            <div class="toggle-knob"></div>
        </div>
    </div>
    <div class="toggle-row">
        <span>Include Symbols</span>
        <div class="toggle active" data-option="symbols">
            <div class="toggle-knob"></div>
        </div>
    </div>
    <div class="toggle-row">
        <span>Include Uppercase</span>
        <div class="toggle active" data-option="uppercase">
            <div class="toggle-knob"></div>
        </div>
    </div>
    <div class="toggle-row">
        <span>Exclude Ambiguous</span>
        <div class="toggle" data-option="ambiguous">
            <div class="toggle-knob"></div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-title">
        <i data-lucide="key" style="width: 16px; height: 16px;"></i>
        GENERATED PASSWORD
    </div>
    <div class="output-box" id="passwordOutput">Click Generate</div>
    <div class="strength-meter">
        <div class="strength-fill" id="strengthFill"></div>
    </div>
    <div style="display: flex; gap: 12px; margin-top: 16px;">
        <button class="btn" id="generateBtn">
            <i data-lucide="wand-2" style="width: 18px; height: 18px;"></i>
            GENERATE
        </button>
        <button class="btn btn-secondary btn-icon" id="copyBtn">
            <i data-lucide="copy" style="width: 20px; height: 20px;"></i>
        </button>
    </div>
</div>

<div class="toast" id="toast">
    <i data-lucide="check-circle" style="width: 20px; height: 20px; color: var(--success);"></i>
    <span id="toastText">Success</span>
</div>

<script>
lucide.createIcons();

// HARDCODED WORD LISTS - MENGI RANDOM PICKED
const WORD_LIST = [
    'Bunny', 'Tiger', 'Eagle', 'Shark', 'Wolf', 'Bear', 'Lion', 'Hawk', 'Fox', 'Owl',
    'Storm', 'Thunder', 'Lightning', 'Ocean', 'River', 'Mountain', 'Forest', 'Desert', 'Island', 'Valley',
    'Diamond', 'Crystal', 'Silver', 'Golden', 'Ruby', 'Emerald', 'Sapphire', 'Pearl', 'Jade', 'Amber',
    'Shadow', 'Phantom', 'Spirit', 'Ghost', 'Mystic', 'Cosmic', 'Astral', 'Solar', 'Lunar', 'Stellar',
    'Swift', 'Rapid', 'Quick', 'Flash', 'Blaze', 'Flame', 'Spark', 'Glide', 'Drift', 'Rush',
    'Happy', 'Brave', 'Clever', 'Lucky', 'Mighty', 'Noble', 'Royal', 'Epic', 'Wild', 'Bold',
    'Quantum', 'Vector', 'Matrix', 'Cipher', 'Nexus', 'Vertex', 'Helix', 'Prism', 'Flux', 'Core',
    'Alpha', 'Beta', 'Delta', 'Gamma', 'Omega', 'Sigma', 'Nova', 'Ultra', 'Mega', 'Giga',
    'Frost', 'Ember', 'Tide', 'Wind', 'Stone', 'Iron', 'Steel', 'Titan', 'Apex', 'Zenith'
];

let currentStrength = 'easy';
let currentLength = 12;
let options = {
    numbers: true,
    symbols: true,
    uppercase: true,
    ambiguous: false
};
let audioCtx;

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(freq, duration, type = 'sine') {
    try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        osc.type = type;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function vibrate(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
}

function showToast(text, success = true) {
    const toast = document.getElementById('toast');
    const icon = toast.querySelector('i');
    document.getElementById('toastText').textContent = text;
    icon.setAttribute('data-lucide', success? 'check-circle' : 'alert-circle');
    icon.style.color = success? 'var(--success)' : 'var(--danger)';
    lucide.createIcons();
    toast.classList.add('show');
    playSound(success? 600 : 300, 0.1);
    vibrate(success? 50 : [100, 50, 100]);
    setTimeout(() => toast.classList.remove('show'), 2000);
}

// Strength Selection
document.querySelectorAll('.strength-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.strength-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStrength = btn.dataset.strength;
        if (currentLength > 20) {
            currentStrength = 'hard';
            document.querySelectorAll('.strength-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-strength="hard"]').classList.add('active');
        }
        playSound(500, 0.05);
        vibrate(30);
    });
});

// Slider + Input Sync
const slider = document.getElementById('lengthSlider');
const charInput = document.getElementById('charInput');

slider.addEventListener('input', (e) => {
    currentLength = parseInt(e.target.value);
    charInput.value = currentLength;
    if (currentLength > 20) {
        currentStrength = 'hard';
        document.querySelectorAll('.strength-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-strength="hard"]').classList.add('active');
        showToast('Hard mode activated for 20+ chars', true);
    }
});

charInput.addEventListener('input', (e) => {
    let val = parseInt(e.target.value);
    if (isNaN(val)) val = 4;
    if (val < 4) val = 4;
    if (val > 128) val = 128;
    currentLength = val;
    slider.value = val;
    e.target.value = val;
    if (currentLength > 20) {
        currentStrength = 'hard';
        document.querySelectorAll('.strength-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-strength="hard"]').classList.add('active');
    }
});

// Toggles
document.querySelectorAll('.toggle').forEach(toggle => {
    toggle.addEventListener('click', () => {
        toggle.classList.toggle('active');
        options[toggle.dataset.option] = toggle.classList.contains('active');
        playSound(450, 0.05);
        vibrate(30);
    });
});

// Password Generation - HARDCODED WORDS
function generatePassword() {
    let password = '';

    if (currentStrength === 'easy') {
        // Pick 3 random words from hardcoded list
        let words = [];
        for(let i = 0; i < 3; i++) {
            words.push(WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)]);
        }
        password = words.join('');
        if (options.numbers) password += Math.floor(Math.random() * 9000 + 1000);
    } else if (currentStrength === 'normal') {
        // Pick 2 random words and leetspeak
        let word1 = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)].toLowerCase();
        let word2 = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)].toLowerCase();
        password = word1 + word2;

        if (options.uppercase) {
            password = password.split('').map(c => Math.random() > 0.5? c.toUpperCase() : c).join('');
        }
        if (options.numbers) {
            password = password.replace(/a/g, '@').replace(/e/g, '3').replace(/i/g, '!').replace(/o/g, '0').replace(/s/g, '5');
        }
        if (options.symbols) {
            const syms = '!@#$%^&*';
            password += syms[Math.floor(Math.random() * syms.length)];
        }
    } else {
        let charset = '';
        if (options.uppercase) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        charset += 'abcdefghijklmnopqrstuvwxyz';
        if (options.numbers) charset += '0123456789';
        if (options.symbols) charset += '!@#$%^&*()_+-=[]{}|;:,.<>?';
        if (options.ambiguous) charset = charset.replace(/[lI1O0]/g, '');
        if (charset.length === 0) charset = 'abcdefghijklmnopqrstuvwxyz';

        const array = new Uint32Array(currentLength);
        crypto.getRandomValues(array);
        for (let i = 0; i < currentLength; i++) {
            password += charset[array[i] % charset.length];
        }
    }

    if (password.length < currentLength) {
        const extra = currentLength - password.length;
        const array = new Uint32Array(extra);
        crypto.getRandomValues(array);
        const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
        for (let i = 0; i < extra; i++) {
            password += chars[array[i] % chars.length];
        }
    }

    password = password.substring(0, currentLength);
    document.getElementById('passwordOutput').textContent = password;
    updateStrengthMeter(password);
    playSound(700, 0.1);
    vibrate(50);
}

function updateStrengthMeter(pwd) {
    let strength = 0;
    if (pwd.length >= 8) strength++;
    if (pwd.length >= 12) strength++;
    if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) strength++;
    if (/[0-9]/.test(pwd)) strength++;
    if (/[^a-zA-Z0-9]/.test(pwd)) strength++;

    const fill = document.getElementById('strengthFill');
    fill.className = 'strength-fill';
    if (strength <= 1) fill.classList.add('weak');
    else if (strength === 2) fill.classList.add('medium');
    else if (strength === 3) fill.classList.add('strong');
    else fill.classList.add('very-strong');
}

document.getElementById('generateBtn').addEventListener('click', generatePassword);

document.getElementById('copyBtn').addEventListener('click', () => {
    const text = document.getElementById('passwordOutput').textContent;
    if (text && text!== 'Click Generate') {
        navigator.clipboard.writeText(text);
        showToast('Copied to clipboard!');
    }
});

// Initialize
generatePassword();
</script>
</body>
</html>
