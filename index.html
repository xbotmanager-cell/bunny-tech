<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny Alpha Dashboard</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0d0614; --glass: rgba(25, 15, 38, 0.6); --border: rgba(255, 255, 255, 0.08);
            --text: #f2f2f7; --muted: #aeaeae; --purple: #bf5af2; --pink: #ff377f; --green: #30d158;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
        header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(13,6,20,0.5); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100; }
        .brand { font-weight: 700; background: linear-gradient(135deg, var(--purple), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .icon-btn { background: var(--glass); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .badge { position: absolute; top: -2px; right: -2px; background: var(--green); color: #000; font-size: 0.65rem; font-weight: 800; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        main { padding: 15px; display: flex; flex-direction: column; gap: 20px; }
        .view-section { display: none; }
        .view-section.active { display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 16px; padding: 15px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn-link { background: var(--glass); border: 1px solid var(--border); padding: 12px; border-radius: 12px; color: var(--text); text-decoration: none; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .item-card { background: var(--glass); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: var(--text); margin-bottom: 8px; }
        .drawer { position: fixed; top: 0; right: -100%; width: 100%; max-width: 360px; height: 100vh; background: rgba(13,6,20,0.95); backdrop-filter: blur(20px); border-left: 1px solid var(--border); z-index: 200; transition: 0.3s; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .drawer.open { right: 0; }
        .notif-item { background: var(--glass); border: 1px solid var(--border); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 0.8rem; }
        .bottom-nav { position: fixed; bottom: 15px; left: 15px; right: 15px; height: 60px; background: rgba(25,15,38,0.85); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 30px; display: flex; justify-content: space-around; align-items: center; z-index: 90; }
        .nav-item { background: transparent; border: none; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: var(--purple); }
        .toast-container { position: fixed; top: 75px; left: 15px; right: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 150; }
        .toast { background: rgba(25,15,38,0.9); border-left: 4px solid var(--purple); padding: 10px 15px; border-radius: 8px; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <header>
        <span class="brand">BunnyAlpha</span>
        <button class="icon-btn" id="notifBtn"><i data-lucide="bell"></i><span class="badge" id="notifBadge">0</span></button>
    </header>

    <main>
        <div id="view-home" class="view-section active">
            <div class="card"><h2 id="greeting">Welcome</h2><p style="font-size:0.8rem; color:var(--muted)">Modular execution gateway.</p></div>
            <div class="grid">
                <a href="https://github.com/xbotmanager-cell" target="_blank" class="btn-link">GitHub <i data-lucide="github"></i></a>
                <a href="https://wa.me/255780470905" target="_blank" class="btn-link">WhatsApp <i data-lucide="message-circle"></i></a>
            </div>
            <div class="item-card" id="installBtn" style="cursor:pointer;">
                <div><h4>Install App</h4><p style="font-size:0.75rem; color:var(--muted)">Add to home screen</p></div>
                <i data-lucide="plus"></i>
            </div>
        </div>

        <div id="view-tools" class="view-section"><h3>Utilities</h3><div id="tools-container"></div></div>
        <div id="view-media" class="view-section"><h3>Media Hub</h3><div id="media-container"></div></div>
        <div id="view-about" class="view-section"><div class="card"><h3>Architecture</h3><p style="font-size:0.85rem; color:var(--muted); margin-top:8px;">Decentralized system engine processing external parsed HTML structures asynchronously.</p></div></div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <div class="drawer" id="notifDrawer">
        <div style="display:flex; justify-content:space-between; align-items:center;"><h3>Alerts</h3><button class="icon-btn" id="closeNotifBtn"><i data-lucide="x"></i></button></div>
        <div id="notifList" style="overflow-y:auto; flex:1;"></div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" data-target="view-home"><i data-lucide="layout-dashboard"></i></button>
        <button class="nav-item" data-target="view-tools"><i data-lucide="cpu"></i></button>
        <button class="nav-item" data-target="view-media"><i data-lucide="film"></i></button>
        <button class="nav-item" data-target="view-about"><i data-lucide="help-circle"></i></button>
    </nav>

    <script>
        let deferredPrompt;
        const API = "https://api.github.com/repos/xbotmanager-cell/bunny-tech/contents/public";
        lucide.createIcons();

        let notifCount = 0;
        function addNotif(title, msg) {
            notifCount++;
            document.getElementById('notifBadge').innerText = notifCount;
            const item = document.createElement('div');
            item.className = 'notif-item';
            item.innerHTML = `<strong>${title}</strong><p>${msg}</p>`;
            const list = document.getElementById('notifList');
            list.insertBefore(item, list.firstChild);
            showToast(`${title}: ${msg}`);
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i data-lucide="info" style="width:16px;"></i><span>${msg}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.remove(), 3000);
        }

        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });

        document.getElementById('notifBtn').addEventListener('click', () => {
            document.getElementById('notifDrawer').classList.add('open');
            notifCount = 0; document.getElementById('notifBadge').innerText = '0';
        });
        document.getElementById('closeNotifBtn').addEventListener('click', () => document.getElementById('notifDrawer').classList.remove('open'));

        const hr = new Date().getHours();
        document.getElementById('greeting').innerText = hr < 12 ? "Good Morning" : hr < 18 ? "Good Afternoon" : "Good Evening";

        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; } 
            else { showToast("Running via Web Engine Viewport Node."); }
        });

        async function fetchRepo() {
            try {
                const res = await fetch(API); if(!res.ok) throw new Error();
                const files = await res.json();
                const tools = document.getElementById('tools-container'), media = document.getElementById('media-container');
                tools.innerHTML = ''; media.innerHTML = '';

                try {
                    const ipRes = await fetch('https://api.ipify.org?format=json');
                    const ipData = await ipRes.json();
                    addNotif("Network Active", `Connected via: ${ipData.ip}`);
                } catch(e) { addNotif("Network Active", "Offline Mode Enabled"); }

                files.forEach(f => {
                    if(f.type === "file" && f.name.endsWith(".html")) {
                        let cat = f.name.split("-")[0].toLowerCase();
                        let name = f.name.replace(".html", "").replace(/[-_]/g, " ").toUpperCase();
                        const a = document.createElement('a'); a.className = 'item-card'; a.href = `public/${f.name}`;
                        a.innerHTML = `<div><h4>${name}</h4><p style="font-size:0.75rem; color:var(--muted)">Module Node</p></div><i data-lucide="arrow-right"></i>`;
                        
                        if(cat === "tools") tools.appendChild(a);
                        else if(["entertainment","downloader","sports","movies"].includes(cat)) media.appendChild(a);
                    }
                });
                lucide.createIcons();
            } catch(e) { 
                showToast("Repository Endpoint Access Denied."); 
            }
        }
        window.addEventListener('DOMContentLoaded', fetchRepo);
    </script>
</body>
</html>
